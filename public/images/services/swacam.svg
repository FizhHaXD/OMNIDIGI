<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-emerald" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="meter-body" x1="28" y1="28" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow-meter" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#065F46" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg-emerald)" opacity="0.12"/>
  <circle cx="60" cy="60" r="44" fill="#10B981" opacity="0.08"/>
  <!-- Digital Meter Housing -->
  <g filter="url(#shadow-meter)">
    <rect x="30" y="24" width="60" height="68" rx="14" fill="url(#meter-body)"/>
    <rect x="32" y="26" width="56" height="64" rx="12" stroke="#334155" stroke-width="1.5"/>
    <!-- Meter LCD Display -->
    <rect x="38" y="34" width="44" height="24" rx="6" fill="#022C22"/>
    <rect x="40" y="36" width="40" height="20" rx="4" stroke="#059669" stroke-width="0.8"/>
    <!-- Digits -->
    <text x="43" y="50" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34D399" letter-spacing="1">04892</text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="bold" fill="#10B981">kWh</text>
    <!-- Pulse LED Indicator -->
    <circle cx="44" cy="66" r="3" fill="#EF4444"/>
    <circle cx="54" cy="66" r="3" fill="#FDB813"/>
    <circle cx="64" cy="66" r="3" fill="#10B981"/>
    <!-- Barcode / Optical Port -->
    <circle cx="60" cy="78" r="5" fill="#334155" stroke="#475569" stroke-width="1"/>
  </g>
  <!-- Camera Scanner Optical Frame -->
  <g filter="url(#shadow-meter)">
    <circle cx="82" cy="74" r="16" fill="#10B981"/>
    <!-- Camera icon inside badge -->
    <path d="M76 71h2l1.5-2h5l1.5 2h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z" fill="#FFFFFF"/>
    <circle cx="82" cy="75" r="2.5" fill="#065F46"/>
  </g>
</svg>
