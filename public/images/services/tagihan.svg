<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-blue" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00529C"/>
      <stop offset="100%" stop-color="#00265a"/>
    </linearGradient>
    <linearGradient id="paper-grad" x1="30" y1="20" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="yellow-bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="100%" stop-color="#FDB813"/>
    </linearGradient>
    <filter id="shadow-soft" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#001a4d" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg-blue)" opacity="0.08"/>
  <circle cx="60" cy="60" r="44" fill="#00529C" opacity="0.06"/>
  <!-- Paper Invoice -->
  <g filter="url(#shadow-soft)">
    <rect x="34" y="24" width="52" height="72" rx="8" fill="url(#paper-grad)"/>
    <path d="M34 32h52" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="42" y="38" width="24" height="4" rx="2" fill="#00529C" opacity="0.8"/>
    <rect x="42" y="46" width="36" height="3" rx="1.5" fill="#CBD5E1"/>
    <rect x="42" y="52" width="28" height="3" rx="1.5" fill="#CBD5E1"/>
    <rect x="42" y="58" width="32" height="3" rx="1.5" fill="#CBD5E1"/>
    <!-- Total highlight line -->
    <rect x="40" y="68" width="40" height="14" rx="4" fill="#00529C" fill-opacity="0.08"/>
    <text x="44" y="79" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" fill="#00529C">Rp</text>
    <rect x="58" y="74" width="18" height="4" rx="2" fill="#00529C"/>
    <!-- Perforated Bottom edge -->
    <circle cx="40" cy="96" r="2.5" fill="#F1F5F9"/>
    <circle cx="48" cy="96" r="2.5" fill="#F1F5F9"/>
    <circle cx="56" cy="96" r="2.5" fill="#F1F5F9"/>
    <circle cx="64" cy="96" r="2.5" fill="#F1F5F9"/>
    <circle cx="72" cy="96" r="2.5" fill="#F1F5F9"/>
    <circle cx="80" cy="96" r="2.5" fill="#F1F5F9"/>
  </g>
  <!-- Floating Lightning Seal -->
  <g filter="url(#shadow-soft)">
    <circle cx="78" cy="32" r="16" fill="url(#yellow-bolt)"/>
    <path d="M78 22l-6 11h6l-3 10 9-13h-6l4-8h-4z" fill="#001a4d"/>
  </g>
</svg>
