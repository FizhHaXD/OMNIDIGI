<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-slate" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="30" y1="20" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00529C"/>
      <stop offset="100%" stop-color="#00265a"/>
    </linearGradient>
    <filter id="shadow-profile" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#001a4d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg-slate)" opacity="0.1"/>
  <circle cx="60" cy="60" r="44" fill="#475569" opacity="0.06"/>
  <!-- Security Shield & User Avatar -->
  <g filter="url(#shadow-profile)">
    <path d="M60 22l28 10v26c0 20-14 36-28 42-14-6-28-22-28-42V32l28-10z" fill="url(#shield-grad)"/>
    <path d="M60 24l26 9.5v24.5c0 18.5-13 33.5-26 39-13-5.5-26-20.5-26-39V33.5l26-9.5z" stroke="#38BDF8" stroke-width="1.2" opacity="0.5"/>
    <!-- User Avatar Interior -->
    <circle cx="60" cy="46" r="10" fill="#FFFFFF"/>
    <path d="M44 68c0-8.8 7.2-14 16-14s16 5.2 16 14v4H44v-4z" fill="#FFFFFF"/>
  </g>
  <!-- Floating Golden Gear Setting -->
  <g filter="url(#shadow-profile)">
    <circle cx="82" cy="74" r="15" fill="#FDB813"/>
    <path d="M82 66v2m0 12v2m-6-8h-2m14 0h2m-10.5-5.5l-1.5-1.5m10 10l1.5 1.5m-10 0l-1.5 1.5m10-10l1.5-1.5" stroke="#001a4d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="82" cy="74" r="4" fill="#001a4d"/>
  </g>
</svg>
