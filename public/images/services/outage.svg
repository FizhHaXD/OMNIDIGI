<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-red" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="hazard-grad" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <filter id="shadow-hazard" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#B91C1C" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg-red)" opacity="0.12"/>
  <circle cx="60" cy="60" r="44" fill="#EF4444" opacity="0.08"/>
  <!-- Warning Shield / Triangle -->
  <g filter="url(#shadow-hazard)">
    <path d="M60 26l32 54a6 6 0 0 1-5.2 9H33.2a6 6 0 0 1-5.2-9l32-54a6 6 0 0 1 10 0z" fill="url(#hazard-grad)" stroke="#F59E0B" stroke-width="2"/>
    <!-- Warning Sign Interior -->
    <path d="M60 44v18" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="72" r="2.5" fill="#DC2626"/>
  </g>
  <!-- Floating Maintenance Wrench Tool -->
  <g filter="url(#shadow-hazard)">
    <circle cx="78" cy="76" r="16" fill="#00529C"/>
    <path d="M74 72l8 8m-4-10l2-2a3 3 0 0 1 4 4l-2 2m-2-2l-6 6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
