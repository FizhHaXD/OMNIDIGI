<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-cyan" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="calc-body" x1="30" y1="20" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00529C"/>
      <stop offset="100%" stop-color="#00265a"/>
    </linearGradient>
    <filter id="shadow-calc" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg-cyan)" opacity="0.12"/>
  <circle cx="60" cy="60" r="44" fill="#06B6D4" opacity="0.08"/>
  <!-- Smart Calculator Body -->
  <g filter="url(#shadow-calc)">
    <rect x="32" y="24" width="56" height="72" rx="14" fill="url(#calc-body)"/>
    <!-- Solar Screen / Display -->
    <rect x="38" y="32" width="44" height="18" rx="6" fill="#F8FAFC"/>
    <text x="44" y="45" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#00529C">Rp ~450k</text>
    <!-- Keypad grid -->
    <rect x="40" y="56" width="9" height="7" rx="2" fill="#38BDF8"/>
    <rect x="52" y="56" width="9" height="7" rx="2" fill="#38BDF8"/>
    <rect x="64" y="56" width="16" height="7" rx="2" fill="#FDB813"/>
    
    <rect x="40" y="66" width="9" height="7" rx="2" fill="#38BDF8"/>
    <rect x="52" y="66" width="9" height="7" rx="2" fill="#38BDF8"/>
    <rect x="64" y="66" width="16" height="7" rx="2" fill="#38BDF8"/>

    <rect x="40" y="76" width="9" height="7" rx="2" fill="#38BDF8"/>
    <rect x="52" y="76" width="9" height="7" rx="2" fill="#38BDF8"/>
    <rect x="64" y="76" width="16" height="7" rx="2" fill="#22C55E"/>
  </g>
  <!-- Floating Coin with Lightning -->
  <g filter="url(#shadow-calc)">
    <circle cx="82" cy="74" r="16" fill="#FDB813"/>
    <circle cx="82" cy="74" r="13" stroke="#B45309" stroke-width="1.2" stroke-dasharray="2 1"/>
    <path d="M83 67l-4 7h4l-2 6 6-8h-4l3-5h-3z" fill="#001a4d"/>
  </g>
</svg>
