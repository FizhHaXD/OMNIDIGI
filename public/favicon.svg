      <stop offset="0%" stop-color="#00529C"/>
      <stop offset="100%" stop-color="#001d42"/>
    </linearGradient>
    <linearGradient id="plnYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="100%" stop-color="#FDB813"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FDB813" flood-opacity="0.5"/>
